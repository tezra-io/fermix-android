[versions]
# Android Gradle plugin 9.4 documents Gradle 9.6 and JDK 17 as its floor. Its default build-tools
# revision, 36.0.0 for 9.4.1, is the one scripts/check_release_policy.sh (BUILD_TOOLS_VERSION) reads the
# release APK with: a bump of agp checks that default and moves the script's with it.
agp = "9.4.1"
# AGP 9 compiles Kotlin itself (built-in Kotlin); build-logic puts this Kotlin Gradle plugin on its classpath.
kotlin = "2.4.20"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
# The app's navigation (design section 12.1: Navigation 3 1.2): the feature modules expose their entries
# over the runtime's EntryProviderScope, and the app shows the back stack with the UI's NavDisplay.
navigation3 = "1.2.0"
# The onboarding ViewModel, which holds the pairing across a rotation or a fold (design section 13.11,
# rule 3), made in the activity's store by its Compose initializer. Navigation 3 1.2.0 asks for 2.10 or
# newer; 2.11.0 (2026-06-17) is the newest release.
lifecycle = "2.11.0"
# The scan's camera and its QR reader (design section 12.1: CameraX 1.6 and zxing-cpp 3.1, the code read in
# process, never by Play services): CameraX's core, its Camera2 implementation, its lifecycle binding and its
# Compose viewfinder, and zxing-cpp's Android binding, which reads a frame's luminance in its native library.
# 1.6.2 (2026-08-26) and 3.1.1 (2026-07-29) are the newest; zxing-cpp asks for camera-core 1.5.2, 1.6.2 meets it.
camerax = "1.6.2"
zxingCpp = "3.1.1"
# The instrumented tests (CI/CD design section 3, `ui`): AndroidX Test's runner and its JUnit 4 runner class,
# beside Compose's test rule from the BOM. That rule brings Espresso 3.5.0, which fails on API 36 before a
# test runs (it calls InputManager.getInstance, gone from Android 16); 3.7.0, of the same release as the
# runner, does not.
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestEspresso = "3.7.0"
# The window size classes of design section 13.11. Compose UI 1.12.1 already resolves window 1.5.0,
# whose window-core computes a class from the window's size in dp, with no Activity, so previews have one.
androidxWindow = "1.5.0"
# The screenshot tests of the `screens` job (CI/CD design section 3): Roborazzi generates a test for
# each preview, found by ComposablePreviewScanner, and renders it on Robolectric's native graphics.
# The official Compose Preview Screenshot Testing plugin needs android.experimental.enableScreenshotTest,
# which AGP 9.4 answers with a WARNING: line that only a suppression would silence.
roborazzi = "1.76.0"
composablePreviewScanner = "0.9.3"
robolectric = "4.17"
# Robolectric's Android 16 (API 36, the targetSdk) runtime for 4.17. Gradle resolves and verifies it, and
# Robolectric reads it offline (fermix.android.library.compose), never fetching anything itself.
robolectricAndroidAll = "16-robolectric-13921718-i7"
# Robolectric runs JUnit 4 tests only; the JUnit Platform runs them through the Vintage engine.
junit4 = "4.13.2"
# The wire codec (design sections 12.1 and 17); its compiler plugin is the Kotlin version's own.
kotlinxSerialization = "1.11.0"
# The transport's WebSocket (design sections 12.1 and 17); the tests' mockwebserver3 and okhttp-tls
# are released with it.
okhttp = "5.5.0"
# Kotlin's standard concurrency, which the design assumes without naming it.
kotlinxCoroutines = "1.11.0"
# The data layer's per-(instance, profile) database (design sections 9.1 and 12.1: Room 2.8, no SQLCipher),
# its Gradle plugin, which exports the schema to data/schemas for the migrations to come, and the bundled
# SQLite it runs on, at the version this Room is built against. Room's compiler runs under KSP, which since
# 2.3.0 is versioned on its own, no longer per Kotlin release; 2.3.12 (2026-09-09), the newest, runs with
# Kotlin 2.4.20 and AGP 9's built-in Kotlin.
room = "2.8.5"
sqlite = "2.6.2"
ksp = "2.3.12"
# The typed DataStore of the instance records (design section 12.1's DataStore 1.2.1); its core alone, with
# a kotlinx.serialization serializer, not protobuf.
datastore = "1.2.1"
# detekt 1.23.8, the last stable, uses Gradle APIs that Gradle 9.6 deprecates, so it fails
# --warning-mode fail; the 2.0 line is built against Kotlin 2.4, Gradle 9.6 and AGP 9 built-in Kotlin.
detekt = "2.0.0-alpha.6"
ktlint = "1.8.0"
ktlintGradle = "14.2.0"
junit = "6.1.3"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# The scan's camera binds to the screen's lifecycle and reads the permission again as the screen resumes.
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-compose = { module = "androidx.camera:camera-compose", version.ref = "camerax" }
zxing-cpp-android = { module = "io.github.zxing-cpp:android", version.ref = "zxingCpp" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-window-core = { module = "androidx.window:window-core", version.ref = "androidxWindow" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "datastore" }
# The Room module convention (fermix.android.library.room) adds these three.
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
# The same SQLite built for desktop JVMs: its native library for this machine is what a Room module's JVM
# tests load in place of the Android one (fermix.android.library.room).
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }

# Build logic: the plugins the convention plugins apply.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
roborazzi-gradle-plugin = { module = "io.github.takahirom.roborazzi:roborazzi-gradle-plugin", version.ref = "roborazzi" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
room-gradle-plugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
detekt-gradle-plugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintGradle" }

# Tests. Gradle 9 no longer supplies the JUnit Platform launcher, so it is declared with the engine.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }

# Screenshot tests (fermix.android.library.compose).
roborazzi-compose-preview-scanner-support = { module = "io.github.takahirom.roborazzi:roborazzi-compose-preview-scanner-support", version.ref = "roborazzi" }
composable-preview-scanner = { module = "io.github.sergio-sastre.ComposablePreviewScanner:android", version.ref = "composablePreviewScanner" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-android-all = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectricAndroidAll" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }

# Instrumented tests (fermix.android.library.compose).
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }

[plugins]
# Applied to build-logic itself, so the convention plugins pass the same gates as the app.
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
