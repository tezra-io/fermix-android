# Warnings are errors (CI/CD design C11): a Gradle deprecation fails the build, and so does a
# Kotlin compiler warning in a build script, such as a call to a DSL member AGP deprecates. The
# included build-logic build does not read this line; build-logic/gradle.properties repeats it.
org.gradle.warning.mode=fail
org.gradle.kotlin.dsl.allWarningsAsErrors=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

android.useAndroidX=true
