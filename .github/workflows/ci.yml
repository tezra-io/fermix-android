# The Android app's pull-request pipeline (MILESTONE_51_ANDROID_CI_CD.md section 3), on every pull
# request and every push to main or dev: the vendored contract against its pins and the engine, the
# build with every quality gate and the dependency checksums, the JVM tests, the screenshot tests,
# the instrumented tests on the emulator, the release APK's policy, and the release pipeline's scripts
# and workflows, folded into one job named gate that branch protection requires (C3). It needs no
# secret, so a fork's pull request runs all of it.
# No job retries, except that ui runs its tests once more when the emulator did not boot, and says so
# in its summary (section 3's one exception).
#
# The contract, unit and screens timeouts are twice their budgets in section 3 (2, 5 and 8 minutes):
# the budget is the target, the timeout the ceiling past which a job is stuck, not slow. The build
# job's is 30 minutes, as it runs the whole build, which outgrew twice section 3's 8 (below, and among
# README.md's departures). ui's is its budget, 25 minutes, room for the build, a boot that fails and
# the second one. The policy check's is its budget, 2 minutes, after 16 for the release build.
#
# setup-gradle runs with cache-provider basic, the open-source cache on the GitHub Actions cache,
# not its default proprietary one. Basic saves ~/.gradle/caches (the dependencies, the build cache
# and the compiled build scripts) and ~/.gradle/wrapper, never the project's configuration cache.
# So every run configures from scratch and a Gradle deprecation raised at configuration time fails
# it (--warning-mode fail), while task outputs may come from the build cache. Keep it so: a reused
# configuration cache entry would hide such a deprecation.
name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # C4: checksums and provenance, then byte for byte against the engine commit SOURCE.json pins,
  # fetched from the public engine repository.
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checksums and provenance
        run: scripts/verify_protocol_contract.sh

      - name: Byte-identical to the pinned engine commit
        run: scripts/verify_protocol_contract.sh --pinned

  # C11, C12: debug and release compile with no warning; lint, detekt and ktlint are clean; every
  # dependency matches gradle/verification-metadata.xml; the wrapper jar is Gradle's own.
  build:
    runs-on: ubuntu-24.04
    # 10.8, 14.6, then over 16 minutes (cancelled) as A2 and A3 grew: it runs all of `build`, AGENTS.md's done.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-provider: basic

      # C5: the debug build is signed with a key made for this run. No daemon accepts it, and it
      # is gone with the runner.
      - name: Make a throwaway debug key
        run: |
          store="$RUNNER_TEMP/ci-debug.jks"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          keytool -genkeypair -noprompt -keystore "$store" -alias ci-debug \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Fermix Android CI, O=Tezra, C=US" \
            -storepass "$password" -keypass "$password"
          {
            echo "FERMIX_DEBUG_STORE_FILE=$store"
            echo "FERMIX_DEBUG_STORE_PASSWORD=$password"
            echo "FERMIX_DEBUG_KEY_ALIAS=ci-debug"
            echo "FERMIX_DEBUG_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      # --warning-mode fail fails on Gradle's own deprecations, and allWarningsAsErrors on the Kotlin
      # compiler's, but the Android Gradle plugin prints its own warnings (a deprecated android.*
      # option, for one) as WARNING: lines and exits 0. So the log is searched for them, and for a
      # compiler's w: line in case one ever gets past its flag. A clean build prints neither.
      - name: Build and check
        shell: bash
        run: |
          log="$RUNNER_TEMP/build.log"
          ./gradlew --warning-mode fail --console=plain build 2>&1 | tee "$log"
          if grep -E '^(WARNING:|w: )' "$log"; then
            echo "::error::the build printed the warnings above, and every warning fails it (C11)"
            exit 1
          fi

      # Room writes each database version's schema into data/schemas as the build compiles it. A file
      # there that the build changed is an entity changed under the same version, which Room on a phone
      # refuses to open; one the build added is a new version whose schema was not committed.
      - name: The exported Room schemas are the committed ones
        shell: bash
        run: |
          changed="$(git status --porcelain --untracked-files=all -- data/schemas)"
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- data/schemas
            echo "::error::the build changed data/schemas: bump the database version and commit its schema"
            exit 1
          fi

  # The JVM tests: today the build logic's (signing, version), and with stage A1's modules the JVM
  # half of the device gate (design section 12.6). The root `test` does not reach into the included
  # build-logic build, so its tests are named. The build job's `build` runs them as well, through
  # check, on purpose: it is the gate's first line, AGENTS.md's done.
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: JVM tests
        run: ./gradlew --warning-mode fail test :build-logic:test

  # Section 3's screens: every @FermixPreviews preview, drawn by Roborazzi on Robolectric at the
  # twelve windows and compared with its reference image under the module's src/test/screenshots,
  # which are drawn on Linux x86-64, as this runner draws them. Named at the root,
  # verifyRoborazziDebug runs in every module that has screenshots. A changed image fails the job,
  # within Roborazzi's default comparator: a pixel whose RGBA moves by less than 0.007 (on 0 to 1)
  # counts as unchanged, and the token values themselves are pinned by the design module's tests.
  # A reference that no preview drew fails it too. A failure names its preview, which its twelve
  # windows share, so the upload is the locator: each *_compare.png is named for its preview,
  # window, mode and font scale, and shows the reference, the difference and the new image side by
  # side. The references go up too, for the HTML report that links to them.
  screens:
    runs-on: ubuntu-24.04
    # 5.3, 5.2, then 6.4 minutes over the last three runs, before A3's cards added 144 references (+20 %).
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Screenshots against their references
        run: ./gradlew --warning-mode fail --console=plain verifyRoborazziDebug

      - name: Upload the changed images
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screens-diff
          path: |
            */build/outputs/roborazzi/
            */build/reports/roborazzi/
            */build/test-results/roborazzi/
            */src/test/screenshots/

  # Section 3's ui: the instrumented tests of every module that has them, :feature-onboarding's,
  # :feature-chats', :feature-chat's, :push's and the app's, on an emulator at API 35 and 36, as a phone and
  # as a folding phone. The app's share media-store images and words through the share entry (section 13.6),
  # one image the shell's, another uid's, read through its share's grant; refuse a file: URI and the app's
  # own provider; leave out an item whose provider fails; and set a screen lock for the app lock's test,
  # which they take away again. The app under test is signed with a debug key made for this run (C5). They
  # need no daemon and no camera: a fake pairing control, a fake session and a stub preview
  # stand in (AGENTS.md). Onboarding up to Scan and on to Paired, every failure screen, the Chats list's
  # and a message's long-press menus, the chat's hardware keys, Copy and its announcement, a rotation and a
  # fold that lose nothing on onboarding, the Chats list, the Instance screen and a chat (section 13.11, rule 3;
  # the folds run on the folding profile alone, where a device that cannot fold fails them), TalkBack's
  # labels and order, reduce-motion, and the QR reader on real codes. The emulator needs
  # KVM, which GitHub's Linux runners have once the udev rule below opens it. Animations stay on: the
  # reduce-motion test turns them off itself. The tests run once more only when the emulator never
  # booted or never settled: two markers tell that apart from a setup that failed before the emulator
  # started (the SDK, the system image or the AVD), which is not retried, and from a test that failed;
  # the summary says which happened.
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
        profile: [medium_phone, pixel_fold]
        include:
          # The fold tests need a phone that folds: the phone profile leaves them out, rather than report
          # their skips, which AGP's report counts among the failures while the task passes; the folding
          # profile requires the fold, so that a device that cannot fold fails a test, never skips it.
          # Each module names its own annotation: of a list, AGP hands the runner the first class alone.
          - profile: medium_phone
            onboarding-args: -Pandroid.testInstrumentationRunnerArguments.notAnnotation=io.tezra.fermix.onboarding.FoldingPhone
            chats-args: -Pandroid.testInstrumentationRunnerArguments.notAnnotation=io.tezra.fermix.chats.FoldingPhone
            chat-args: -Pandroid.testInstrumentationRunnerArguments.notAnnotation=io.tezra.fermix.chat.FoldingPhone
          - profile: pixel_fold
            onboarding-args: -Pandroid.testInstrumentationRunnerArguments.requireFold=true
            chats-args: -Pandroid.testInstrumentationRunnerArguments.requireFold=true
            chat-args: -Pandroid.testInstrumentationRunnerArguments.requireFold=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Open KVM to the runner's user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner's cmdline-tools are 12.0, whose avdmanager knows no pixel_fold device, and the action
      # makes the AVD with whatever $ANDROID_HOME/cmdline-tools holds, fetching its own only when there
      # are none. So 20.0, the version it would fetch, replaces them, checked against its sha256 (its sha1
      # agrees with Google's repository2-3.xml), and the profile is looked up here, so that a profile the
      # tools lack fails setup, before any emulator step could take it for a boot that failed.
      - name: Command-line tools 20.0
        shell: bash
        env:
          TOOLS_ZIP: commandlinetools-linux-14742923_latest.zip
          TOOLS_SHA256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
          PROFILE: ${{ matrix.profile }}
        run: |
          zip="$RUNNER_TEMP/$TOOLS_ZIP"
          curl -fsSL --retry 2 -o "$zip" "https://dl.google.com/android/repository/$TOOLS_ZIP"
          echo "$TOOLS_SHA256  $zip" | sha256sum -c -
          rm -rf "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/cmdline-tools"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          unzip -q "$zip" -d "$RUNNER_TEMP/cmdline-tools"
          mv "$RUNNER_TEMP/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          devices="$("$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list device -c)"
          if ! grep -qx "$PROFILE" <<<"$devices"; then
            echo "::error::the avdmanager of $TOOLS_ZIP knows no $PROFILE device"
            exit 1
          fi

      # C5: the app under test is signed with a key made for this run, as the build job's debug build is.
      - name: Make a throwaway debug key
        run: |
          store="$RUNNER_TEMP/ci-debug.jks"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          keytool -genkeypair -noprompt -keystore "$store" -alias ci-debug \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Fermix Android CI, O=Tezra, C=US" \
            -storepass "$password" -keypass "$password"
          {
            echo "FERMIX_DEBUG_STORE_FILE=$store"
            echo "FERMIX_DEBUG_STORE_PASSWORD=$password"
            echo "FERMIX_DEBUG_KEY_ALIAS=ci-debug"
            echo "FERMIX_DEBUG_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      # Built before the emulator starts, so a compile error is never taken for a boot that failed.
      - name: Build the app under test and its tests
        run: |
          ./gradlew --warning-mode fail --console=plain \
            :feature-onboarding:assembleDebugAndroidTest :feature-chats:assembleDebugAndroidTest \
            :feature-chat:assembleDebugAndroidTest :push:assembleDebugAndroidTest :app:assembleDebugAndroidTest

      # The action runs the pre-launch script once the AVD is made, before the emulator starts, and the
      # script line by line, each after the emulator booted; each marks how far it got. A cold boot can
      # leave a system dialog holding the focus a test's key event and clipboard read need, System UI's
      # "isn't responding" among them, so the script first waits for the home screen to have it
      # (scripts/settle_emulator.sh), and marks the emulator booted only once it settled: one that
      # never settles is taken for one that never booted. Each module's tests run in a Gradle run of their
      # own: the build is parallel, and two modules' tests at once would turn and fold one emulator twice.
      - name: Instrumented tests
        id: first
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-boot-timeout: 300
          pre-emulator-launch-script: touch "$RUNNER_TEMP/avd-made"
          script: |
            scripts/settle_emulator.sh
            touch "$RUNNER_TEMP/emulator-booted"
            adb shell svc power stayon true
            ./gradlew --warning-mode fail --console=plain :feature-onboarding:connectedDebugAndroidTest ${{ matrix.onboarding-args }}
            ./gradlew --warning-mode fail --console=plain :feature-chats:connectedDebugAndroidTest ${{ matrix.chats-args }}
            ./gradlew --warning-mode fail --console=plain :feature-chat:connectedDebugAndroidTest ${{ matrix.chat-args }}
            ./gradlew --warning-mode fail --console=plain :push:connectedDebugAndroidTest
            ./gradlew --warning-mode fail --console=plain :app:connectedDebugAndroidTest

      # How far the first run got: booted and settled, made its AVD but never booted or never settled
      # (no-boot), or failed before the AVD was made (no-avd). Only no-boot runs the tests once more.
      - name: How far the emulator got
        id: boot
        if: steps.first.outcome == 'failure'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/emulator-booted" ]; then
            stage=booted
          elif [ -f "$RUNNER_TEMP/avd-made" ]; then
            stage=no-boot
          else
            stage=no-avd
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Instrumented tests, once more after the emulator did not boot
        id: second
        if: steps.first.outcome == 'failure' && steps.boot.outputs.stage == 'no-boot'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: false
          emulator-boot-timeout: 300
          pre-emulator-launch-script: touch "$RUNNER_TEMP/avd-made"
          script: |
            scripts/settle_emulator.sh
            touch "$RUNNER_TEMP/emulator-booted"
            adb shell svc power stayon true
            ./gradlew --warning-mode fail --console=plain :feature-onboarding:connectedDebugAndroidTest ${{ matrix.onboarding-args }}
            ./gradlew --warning-mode fail --console=plain :feature-chats:connectedDebugAndroidTest ${{ matrix.chats-args }}
            ./gradlew --warning-mode fail --console=plain :feature-chat:connectedDebugAndroidTest ${{ matrix.chat-args }}
            ./gradlew --warning-mode fail --console=plain :push:connectedDebugAndroidTest
            ./gradlew --warning-mode fail --console=plain :app:connectedDebugAndroidTest

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-api${{ matrix.api-level }}-${{ matrix.profile }}
          if-no-files-found: ignore
          path: |
            */build/reports/androidTests/connected/
            */build/outputs/androidTest-results/connected/

      # The job's result: the first run's, or after a boot that failed, the second's.
      - name: Summary and result
        if: always()
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api-level }}
          PROFILE: ${{ matrix.profile }}
          FIRST: ${{ steps.first.outcome }}
          STAGE: ${{ steps.boot.outputs.stage }}
          SECOND: ${{ steps.second.outcome }}
        run: |
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then kvm="KVM open"; else kvm="no usable /dev/kvm"; fi
          if [ "$FIRST" = "success" ]; then
            verdict="passed on the first run"
          elif [ "$FIRST" != "failure" ]; then
            verdict="the tests never ran: a step before them failed, or the job was cancelled ($FIRST)"
          elif [ "$STAGE" = "no-avd" ]; then
            verdict="the emulator's SDK, system image or AVD could not be set up, so the tests did not run again"
          elif [ "$STAGE" = "no-boot" ]; then
            verdict="the emulator did not boot, or never settled, so the tests ran once more: $SECOND"
          else
            verdict="the tests failed, on an emulator that booted, so they did not run again"
          fi
          echo "### ui, API $API_LEVEL, $PROFILE: $verdict ($kvm)" >> "$GITHUB_STEP_SUMMARY"
          echo "$verdict ($kvm)"
          [ "$FIRST" = "success" ] || { [ "$STAGE" = "no-boot" ] && [ "$SECOND" = "success" ]; }

  # Section 3's policy: the release APK's manifest says what the design says, minSdk 35, targetSdk 36,
  # not debuggable, no cleartext traffic, no resizability opt-out, nothing in backup or device transfer,
  # exactly the permissions policy/permissions.txt lists, and no camera required; and no test key,
  # vector or fixture is inside it, by name or by content (scripts/check_release_policy.sh). The release
  # is signed with a key made for this run, as the build job's debug key is (C5), so the APK checked is
  # signed as a release is.
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-provider: basic

      - name: Make a throwaway release key
        run: |
          store="$RUNNER_TEMP/ci-release.jks"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          keytool -genkeypair -noprompt -keystore "$store" -alias ci-release \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=Fermix Android CI, O=Tezra, C=US" \
            -storepass "$password" -keypass "$password"
          {
            echo "FERMIX_RELEASE_STORE_FILE=$store"
            echo "FERMIX_RELEASE_STORE_PASSWORD=$password"
            echo "FERMIX_RELEASE_KEY_ALIAS=ci-release"
            echo "FERMIX_RELEASE_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Build the release APK
        run: ./gradlew --warning-mode fail --console=plain :app:assembleRelease

      - name: The release APK against the policy
        timeout-minutes: 2
        run: scripts/check_release_policy.sh app/build/outputs/apk/release/app-release.apk

  # The release pipeline's own gate (section 4, C12): the tests of the scripts candidate.yml and promote.yml call,
  # each of which plants the failure a refusal exists for (a tag off main, a versionCode not raised, a key that
  # is not the release key, seven scenarios, a changed byte in SHA256SUMS, ...) with throwaway keys made by the
  # test; then actionlint, shellcheck and ruff, pinned by checksum, over the three workflows, scripts/*.sh and the
  # scripts' Python, and the house rules actionlint does not hold (scripts/check_workflows.py: every job timed,
  # every action pinned by a commit, no input named for a way around a check, promote.yml's tag its one input).
  # The tests link small APKs with build tools 36.0.0's aapt2 against platform 36 and sign them with its
  # apksigner.
  release-scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Build tools 36.0.0 and platform 36
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.0.0" "platforms;android-36"'

      - name: The release scripts' tests
        run: python3 -m unittest discover --start-directory scripts/tests --verbose

      - name: actionlint, shellcheck, ruff and the house rules
        run: scripts/lint_workflows.sh

  # C3: the one required check. It runs even when a job it needs failed or was cancelled, so a
  # failure can never show up as a skipped, and therefore passing, required check.
  gate:
    if: always()
    needs: [contract, build, unit, screens, ui, policy, release-scripts]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          SCREENS_RESULT: ${{ needs.screens.result }}
          UI_RESULT: ${{ needs.ui.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          RELEASE_SCRIPTS_RESULT: ${{ needs.release-scripts.result }}
        run: |
          echo "contract result: $CONTRACT_RESULT"
          echo "build result: $BUILD_RESULT"
          echo "unit result: $UNIT_RESULT"
          echo "screens result: $SCREENS_RESULT"
          echo "ui result: $UI_RESULT"
          echo "policy result: $POLICY_RESULT"
          echo "release-scripts result: $RELEASE_SCRIPTS_RESULT"
          [ "$CONTRACT_RESULT" = "success" ] || exit 1
          [ "$BUILD_RESULT" = "success" ] || exit 1
          [ "$UNIT_RESULT" = "success" ] || exit 1
          [ "$SCREENS_RESULT" = "success" ] || exit 1
          [ "$UI_RESULT" = "success" ] || exit 1
          [ "$POLICY_RESULT" = "success" ] || exit 1
          [ "$RELEASE_SCRIPTS_RESULT" = "success" ] || exit 1
